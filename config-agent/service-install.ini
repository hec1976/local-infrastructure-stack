# Config Agent 2.7.1
# Generischer Service-Installer 1.3.0

[application]
service_id = config-agent
app_dir = /opt/service/config-agent

[service]
unit = config-agent.service

# Nur Template unter /opt; systemd liest die regulaere Datei unter /etc.
unit_template = service/config-agent.service.example
systemd_dir = /etc/systemd/system
unit_install_path = /etc/systemd/system/config-agent.service
unit_mode = 0644

# Rueckwaerts-Symlink unter /opt auf die installierte /etc-Unit.
create_app_symlink = true
app_symlink_path = service/config-agent.service

verify_unit = true
backup_existing_unit = true
require_template_inside_app = true

# Ein Aufruf von ./_install.sh genuegt.
enable = true
start = true
restart_if_active = true

[directory:app]
path = ${APP_DIR}
owner = root
group = root
mode = 0750
create = true
apply_existing = true
allow_symlink = false

[directory:lib]
path = ${APP_DIR}/lib
owner = root
group = root
mode = 0750
create = true
apply_existing = true
allow_symlink = false

[directory:service]
path = ${APP_DIR}/service
owner = root
group = root
mode = 0750
create = true
apply_existing = true
allow_symlink = false

[directory:backup]
path = ${APP_DIR}/backup
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[directory:backup-managed-configs]
path = ${APP_DIR}/backup/managed-configs
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[directory:backup-git-deploy]
path = ${APP_DIR}/backup/git-deploy-config
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[directory:tmp]
path = ${APP_DIR}/tmp
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[directory:state]
path = /var/lib/service/config-agent/git-deploy
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[directory:log]
path = /var/log/service
owner = root
group = root
mode = 0770
create = true
apply_existing = false
allow_symlink = false

[directory:environment]
path = /opt/service/env
owner = root
group = root
mode = 0700
create = true
apply_existing = false
allow_symlink = false

[file:global-config]
path = ${APP_DIR}/global.json
template = example/global.json.example
owner = root
group = root
mode = 0640
required = true
create_if_missing = true
apply_existing = true
allow_symlink = false

[file:managed-configs]
path = ${APP_DIR}/managed_configs.json
template = example/managed_configs.json.example
owner = root
group = root
mode = 0660
required = true
create_if_missing = true
apply_existing = true
allow_symlink = false

[file:git-deploy]
path = ${APP_DIR}/git_deploy.json
template = example/git_deploy.json.example
owner = root
group = root
mode = 0640
required = true
create_if_missing = true
apply_existing = true
allow_symlink = false

[file:environment-file]
path = /opt/service/env/config-agent.env
template = example/config-agent.env.example
owner = root
group = root
mode = 0600
required = true
create_if_missing = true
apply_existing = true
allow_symlink = false

[file:simplify-git-config]
path = ${APP_DIR}/_simplify_git_config.py
owner = root
group = root
mode = 0750
required = true
apply_existing = true
allow_symlink = false

[analysis]
type = perl
entry = ${APP_DIR}/config-agent.pl
json_files = ${APP_DIR}/global.json, ${APP_DIR}/managed_configs.json, ${APP_DIR}/git_deploy.json
required_commands = /usr/bin/git, /usr/bin/unzip
required_files =
log_file = /var/log/service/config-agent.log

[directory:git-upload-state]
path = /var/lib/service/config-agent/git-upload
owner = root
group = root
mode = 0770
create = true
apply_existing = true
allow_symlink = false

[file:forgejo-token]
path = /opt/service/env/forgejo-api.token
owner = root
group = root
mode = 0600
required = false
apply_existing = true
allow_symlink = false
