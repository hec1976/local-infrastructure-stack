# Local Infrastructure Stack - single-server defaults
#
# SERVER_IP wird standardmaessig automatisch aus der aktiven IPv4/Default-Route
# ermittelt. Ein explizites SERVER_IP beim Aufruf hat Vorrang, z.B.:
#   sudo SERVER_IP=192.168.121.20 ./setup_teko_local.sh

# Persistente Setup-Overrides. Die Datei wird vom interaktiven Setup nur als
# root geschrieben und erlaubt kundenspezifische Hostnamen/FQDNs ohne die
# Paketdefaults zu veraendern. Legacy-Umgebungsvariablen bleiben kompatibel.
STACK_PROFILE_FILE="${STACK_PROFILE_FILE:-/etc/local-infrastructure-stack.conf}"
if [[ -r "$STACK_PROFILE_FILE" ]]; then
    # shellcheck disable=SC1090
    source "$STACK_PROFILE_FILE"
fi

SERVER_IP="${SERVER_IP:-auto}"
SERVER_SHORTNAME="${SERVER_SHORTNAME:-teko}"
SERVER_FQDN="${SERVER_FQDN:-teko.local}"

FORGEJO_FQDN="${FORGEJO_FQDN:-git.local}"
FORGEJO_HTTP_PORT="${FORGEJO_HTTP_PORT:-3000}"
FORGEJO_SSH_PORT="${FORGEJO_SSH_PORT:-2222}"
FORGEJO_ORG="${FORGEJO_ORG:-teko}"
FORGEJO_REPO="${FORGEJO_REPO:-config-deploy}"
FORGEJO_TEAM="${FORGEJO_TEAM:-teko-deploy}"
FORGEJO_SERVICE_USER="${FORGEJO_SERVICE_USER:-svc-teko-deploy}"
FORGEJO_TEAM_PERMISSION="${FORGEJO_TEAM_PERMISSION:-write}"
FORGEJO_BOOTSTRAP_ADMIN_USER="${FORGEJO_BOOTSTRAP_ADMIN_USER:-gitadmin}"
FORGEJO_BOOTSTRAP_ADMIN_EMAIL="${FORGEJO_BOOTSTRAP_ADMIN_EMAIL:-gitadmin@teko.local}"
FORGEJO_ADMIN_ENV_FILE="${FORGEJO_ADMIN_ENV_FILE:-/opt/service/env/forgejo-admin.env}"

CONFIG_MANAGER_FQDN="${CONFIG_MANAGER_FQDN:-config-manager.local}"
CONFIG_AGENT_PORT="${CONFIG_AGENT_PORT:-5008}"
CONFIG_AGENT_URL="${CONFIG_AGENT_URL:-https://127.0.0.1:${CONFIG_AGENT_PORT}}"
CONFIG_MANAGER_ADMIN_ENV_FILE="${CONFIG_MANAGER_ADMIN_ENV_FILE:-/opt/service/env/config-manager-admin.env}"
BASELINE_REPO_DIR="${BASELINE_REPO_DIR:-/srv/www/baseline-repo}"
# Legacy TEKO_BASELINE_* variables are accepted only at this environment boundary.
BASELINE_REPO_URL="${BASELINE_REPO_URL:-${TEKO_BASELINE_REPO_URL:-https://${CONFIG_MANAGER_FQDN}/baseline-repo/}}"
BASELINE_REPO_LOCAL_URL="${BASELINE_REPO_LOCAL_URL:-file://${BASELINE_REPO_DIR%/}/}"
BASELINE_REPO_FETCH="${BASELINE_REPO_FETCH:-${TEKO_BASELINE_REPO_FETCH:-auto}}"

# PHP-Grenzen fuer das Config-Manager-Webportal. Die Defaults sind bewusst auf
# groessere Git-Verzeichnis-/ZIP-Uploads ausgelegt. Sie koennen beim Setup ueber
# gleichnamige Environment-Variablen angepasst werden.
CONFIG_MANAGER_PHP_POST_MAX_SIZE="${CONFIG_MANAGER_PHP_POST_MAX_SIZE:-640M}"
CONFIG_MANAGER_PHP_UPLOAD_MAX_FILESIZE="${CONFIG_MANAGER_PHP_UPLOAD_MAX_FILESIZE:-512M}"
CONFIG_MANAGER_PHP_MAX_FILE_UPLOADS="${CONFIG_MANAGER_PHP_MAX_FILE_UPLOADS:-2000}"
CONFIG_MANAGER_PHP_MAX_INPUT_VARS="${CONFIG_MANAGER_PHP_MAX_INPUT_VARS:-10000}"
CONFIG_MANAGER_PHP_MAX_EXECUTION_TIME="${CONFIG_MANAGER_PHP_MAX_EXECUTION_TIME:-600}"
CONFIG_MANAGER_PHP_MAX_INPUT_TIME="${CONFIG_MANAGER_PHP_MAX_INPUT_TIME:-600}"

GRAFANA_FQDN="${GRAFANA_FQDN:-grafana.local}"
GRAFANA_HTTP_PORT="${GRAFANA_HTTP_PORT:-3001}"
LOKI_HTTP_PORT="${LOKI_HTTP_PORT:-3100}"
PROMETHEUS_HTTP_PORT="${PROMETHEUS_HTTP_PORT:-9090}"
GRAFANA_IMAGE="${GRAFANA_IMAGE:-grafana/grafana:13.2.0}"
LOKI_IMAGE="${LOKI_IMAGE:-grafana/loki:3.7.6}"
PROMETHEUS_IMAGE="${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}"

# Automatische Server-IP-Ermittlung. Bevorzugt wird die Source-Adresse der
# Default-Route; danach die erste globale IPv4. Loopback/Container-Bridge-
# Adressen werden dabei moeglichst vermieden.
if [[ -z "$SERVER_IP" || "$SERVER_IP" == "auto" ]]; then
    _teko_detected_ip=""

    if command -v ip >/dev/null 2>&1; then
        _teko_detected_ip="$(ip -4 route get 1.1.1.1 2>/dev/null \
            | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}' \
            || true)"

        if [[ -z "$_teko_detected_ip" ]]; then
            _teko_detected_ip="$(ip -4 -o addr show scope global 2>/dev/null \
                | awk '$2 !~ /^(lo|docker|podman|virbr|veth|br-)/ {split($4,a,"/"); print a[1]; exit}' \
                || true)"
        fi
    fi

    if [[ -z "$_teko_detected_ip" ]] && command -v hostname >/dev/null 2>&1; then
        _teko_detected_ip="$(hostname -I 2>/dev/null \
            | tr ' ' '\n' \
            | awk '/^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$/ && $0 !~ /^127\./ {print; exit}' \
            || true)"
    fi

    if [[ -z "$_teko_detected_ip" ]]; then
        echo "FEHLER: Keine lokale IPv4-Adresse automatisch gefunden." >&2
        echo "Bitte SERVER_IP explizit setzen, z.B. SERVER_IP=192.168.121.20" >&2
        return 1 2>/dev/null || exit 1
    fi

    SERVER_IP="$_teko_detected_ip"
    unset _teko_detected_ip
fi

export SERVER_IP SERVER_SHORTNAME SERVER_FQDN
export FORGEJO_FQDN FORGEJO_HTTP_PORT FORGEJO_SSH_PORT
export FORGEJO_ORG FORGEJO_REPO FORGEJO_TEAM FORGEJO_SERVICE_USER FORGEJO_TEAM_PERMISSION
export FORGEJO_BOOTSTRAP_ADMIN_USER FORGEJO_BOOTSTRAP_ADMIN_EMAIL FORGEJO_ADMIN_ENV_FILE
export CONFIG_MANAGER_FQDN CONFIG_AGENT_PORT CONFIG_AGENT_URL CONFIG_MANAGER_ADMIN_ENV_FILE
export BASELINE_REPO_DIR BASELINE_REPO_URL BASELINE_REPO_LOCAL_URL BASELINE_REPO_FETCH
export CONFIG_MANAGER_PHP_POST_MAX_SIZE CONFIG_MANAGER_PHP_UPLOAD_MAX_FILESIZE CONFIG_MANAGER_PHP_MAX_FILE_UPLOADS
export CONFIG_MANAGER_PHP_MAX_EXECUTION_TIME CONFIG_MANAGER_PHP_MAX_INPUT_TIME
export GRAFANA_FQDN GRAFANA_HTTP_PORT LOKI_HTTP_PORT PROMETHEUS_HTTP_PORT GRAFANA_IMAGE LOKI_IMAGE PROMETHEUS_IMAGE
